<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}SeaChat · 管理后台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="admin-shell {% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/admin/customers">
      <span class="brand-mark">SC</span>
      <span class="brand-text">SeaChat<em>管理后台</em></span>
    </a>
    <nav class="nav">
      <a href="/admin/customers" class="{{ 'is-active' if active == 'customers' else '' }}">客户</a>
      <a href="/admin/kb" class="{{ 'is-active' if active == 'kb' else '' }}">知识库</a>
    </nav>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noreferrer">用户端</a>
      <span class="admin-user">{{ admin or '—' }}</span>
      <form method="post" action="/admin/logout" class="logout-form">
        <button class="btn btn-sm" type="submit">退出登录</button>
      </form>
    </div>
  </header>

  {% block content %}{% endblock %}

  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  {% block scripts %}{% endblock %}
</body>
</html>
